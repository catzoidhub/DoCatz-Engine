name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vmm:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build docatz-vmm (arm64 and x86_64, ad hoc signed)
        run: |
          sh vmm/build.sh arm64
          sh vmm/build.sh x86_64
          out/docatz-vmm-arm64 version
          codesign -d --entitlements - out/docatz-vmm-x86_64

  agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - name: Vet and build
        working-directory: agent
        run: |
          go vet ./...
          GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null .
          GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null .

  guest:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      # The runner's own arch: Alpine's package scripts run natively in the build container.
      # containerd's Rust shim with our patch, built first: guest/build.sh makes it the default runtime.
      - name: Build the container shim
        run: sh guest/shim/build.sh ${{ matrix.arch }}
      - name: Build the guest
        run: sh guest/build.sh ${{ matrix.arch }}
      # The guest boots under QEMU with `docatz.selftest`: dockerd up, busybox pulled and run on the default runtime,
      # an OOM kill reported. KVM when the runner offers it; otherwise emulated (slower, still minutes).
      - name: Boot the guest and self-test it
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-system-arm >/dev/null
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
          sh scripts/qemu-selftest.sh out/guest-${{ matrix.arch }} ${{ matrix.arch }} 900
      - name: Sizes
        run: ls -la out/guest-${{ matrix.arch }}
