name: Release

# A tag v<VERSION> builds every asset of docs/CONTRACT.md §2 and puts them on a DRAFT release; the maintainer
# publishes it after checking. DoCatz then pins the archives' SHA-256 from manifest.json.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vmm:
    runs-on: macos-15
    env:
      # A step's `if` cannot read secrets (nor env set in that step): whether the certificate is there is decided here.
      HAS_MAC_CERT: ${{ secrets.MAC_CERT_P12 != '' }}
      # Notarization in CI needs an App Store Connect API key (Team key, Developer role). Without it the release is
      # notarized afterwards on the maintainer's Mac: scripts/notarize.sh <version> (same bytes, same SHA-256).
      HAS_NOTARY_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      # Developer ID signing when the secrets exist (as DoCatz's release); else ad hoc, which is enough for the
      # virtualization entitlement (the binary is downloaded by DoCatz, not opened from Finder).
      - name: Import the signing certificate
        if: env.HAS_MAC_CERT == 'true'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          echo "$MAC_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
          echo "IDENTITY=$(security find-identity -v -p codesigning build.keychain | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)" >> "$GITHUB_ENV"
        shell: bash
      - name: Build
        run: |
          sh vmm/build.sh arm64 "${IDENTITY:--}"
          sh vmm/build.sh x86_64 "${IDENTITY:--}"
      - name: Notarize
        if: env.HAS_MAC_CERT == 'true' && env.HAS_NOTARY_KEY == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "$APPLE_API_KEY_P8" | base64 --decode > notary.p8
          for arch in arm64 x86_64; do
            ditto -c -k --keepParent "out/docatz-vmm-$arch" "vmm-$arch.zip"
            xcrun notarytool submit "vmm-$arch.zip" --key notary.p8 --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
              --wait --timeout 30m --output-format json > "notary-$arch.json"
            status=$(python3 -c "import json; print(json.load(open('notary-$arch.json')).get('status',''))")
            echo "docatz-vmm $arch: $status"
            [ "$status" = Accepted ] || { cat "notary-$arch.json"; rm notary.p8; exit 1; }
          done
          rm notary.p8
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: vmm
          path: out/docatz-vmm-*

  guest:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      # containerd's Rust shim with our patch, built first: guest/build.sh makes it the default runtime.
      - name: Build the container shim
        run: sh guest/shim/build.sh ${{ matrix.arch }}
      - name: Build the guest
        run: sh guest/build.sh ${{ matrix.arch }}
      # The guest boots under QEMU with `docatz.selftest`: dockerd up, busybox pulled and run on the default runtime,
      # an OOM kill reported. KVM when the runner offers it; otherwise emulated (slower, still minutes).
      - name: Boot the guest and self-test it
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-system-arm >/dev/null
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
          sh scripts/qemu-selftest.sh out/guest-${{ matrix.arch }} ${{ matrix.arch }} 900
      - uses: actions/upload-artifact@v4
        with:
          name: guest-${{ matrix.arch }}
          path: out/guest-${{ matrix.arch }}

  # A manual run (workflow_dispatch) only builds and signs, to check the certificate: no source tarball, no release.
  kernel-source:
    needs: guest
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: guest-x86_64
          path: out/guest-x86_64
      - name: Fetch the kernel's corresponding source
        run: |
          KREL=$(sed -n 's/.*"kernel": "\([^"]*\)".*/\1/p' out/guest-x86_64/guest.json)
          ALPINE=$(sed -n 's/.*"alpine": "\([^"]*\)".*/\1/p' out/guest-x86_64/guest.json)
          sh guest/kernel-source.sh "$KREL" "$ALPINE" out/release
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-source
          path: out/release/*.tar.xz

  release:
    needs: [vmm, guest, kernel-source]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Pack
        run: |
          mkdir -p out/release
          cp dl/vmm/docatz-vmm-* out/
          chmod +x out/docatz-vmm-*
          cp -R dl/guest-arm64 out/guest-arm64
          cp -R dl/guest-x86_64 out/guest-x86_64
          cp dl/kernel-source/*.tar.xz out/release/
          sh scripts/package.sh
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(cat VERSION)
          awk -v v="## $V" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          gh release create "v$V" --draft --title "DoCatz Engine $V" --notes-file notes.md out/release/*
        shell: bash
